[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformation-graph"
version = "0.15.0"
description = "Git-native enterprise transformation graphs for traceability, impact analysis, governance, and agent context."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dzmitryi Kharlanau"}]
keywords = [
  "enterprise-transformation",
  "sap",
  "s4hana",
  "traceability",
  "data-lineage",
  "impact-analysis",
  "knowledge-graph",
  "architecture-as-code",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8.0", "mcp>=2,<3", "openpyxl>=3.1", "build>=1.2"]

[project.scripts]
transformation-graph = "transformation_graph.cli:main"

[project.urls]
Homepage = "https://github.com/dkharlanau/transformation-graph"
Repository = "https://github.com/dkharlanau/transformation-graph"
Issues = "https://github.com/dkharlanau/transformation-graph/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
