version: "1.0"
interface:
  id: CUSTOMER-MDG-S4-01
  name: Customer replication from SAP MDG to S/4HANA
  description: Replicates approved customer master data from MDG to S/4HANA.
  source: {system: SAP-MDG, object: BusinessPartner}
  target: {system: SAP-S4, object: Customer}
  mode: async
  pattern: message-driven
  criticality: high
  lifecycle: active
  tags: [sap, mdg, customer, idoc]
ownership:
  business: Customer Master Data
  technical: SAP MDG Integration
route:
  middleware: [SAP-Integration-Layer]
trigger: {event: CustomerApproved}
contract: {format: IDoc, message_type: DEBMAS, basic_type: DEBMAS07}
mapping: {file: mapping.yaml, profile: customer-core}
tests:
  - {id: happy-path, description: Approved customer is accepted by S/4HANA., expected: processed}
