version: "0.2"
process:
  id: customer_creation
  name: Customer Creation
  owner: data_governance_lead
  start: request
  trigger: Approved commercial need for a new customer
  outcome: Customer is available in the target system
roles:
  - {id: data_governance_lead, name: Data Governance Lead}
systems:
  - {id: mdg, name: SAP Master Data Governance}
  - {id: s4, name: SAP S/4HANA}
objects:
  - {id: business_partner, name: Business Partner}
interfaces:
  - {id: customer_replication, name: Customer replication}
controls:
  - {id: sanctions_check, name: Sanctions screening}
risks: []
evidence: []
steps:
  - id: request
    name: Submit customer request
    type: user_task
    actor: data_governance_lead
    system: mdg
    objects: [business_partner]
    transitions: [{to: approve}]
  - id: approve
    name: Approve customer
    type: decision
    actor: data_governance_lead
    system: mdg
    controls: [sanctions_check]
    transitions: [{to: replicate, label: approved}]
  - id: replicate
    name: Replicate customer
    type: service_task
    system: mdg
    interfaces: [customer_replication]
    transitions: [{to: complete}]
  - {id: complete, name: Customer created, type: end}
