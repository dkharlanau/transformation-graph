name: Transformation Graph Adapter Conformance
description: "Validate a Mapping/Interface/Process-as-Code artifact against the versioned Transformation Graph adapter contract."
author: "Dzmitryi Kharlanau"

branding:
  icon: share-2
  color: blue

inputs:
  kind:
    description: "Adapter kind: mapping, interface, or process."
    required: true
  input:
    description: "Path to the as-code YAML document in the caller repository."
    required: true
  fail-on:
    description: "Conformance failure threshold: error, warning, or never."
    required: false
    default: error
  report-path:
    description: "JSON report path written in the caller workspace."
    required: false
    default: transformation-graph-conformance.json
  python-version:
    description: "Python version used to run the checker."
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Transformation Graph action package
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Run adapter conformance
      shell: bash
      run: |
        mkdir -p "$(dirname "${{ inputs.report-path }}")"
        transformation-graph adapter-check \
          "${{ inputs.kind }}" \
          "${{ inputs.input }}" \
          --format json \
          --output "${{ inputs.report-path }}" \
          --fail-on "${{ inputs.fail-on }}"
