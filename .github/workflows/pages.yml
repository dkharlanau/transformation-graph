name: Transformation Graph Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Build governed reference project
        run: transformation-graph build-project examples/project/transformation-project.yaml --output-dir build --site --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/explorer/"
      - name: Stage product home and explorer
        run: |
          mkdir -p build/product-site/explorer
          cp -R build/site/. build/product-site/explorer/
          cp docs/product.html build/product-site/index.html
          cp docs/agent-manifest.json build/product-site/agent-manifest.json
          touch build/product-site/.nojekyll
      - name: Detect Pages availability
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository. The site build is valid, but deployment is skipped. Enable Settings > Pages > Source: GitHub Actions to publish it."
          fi
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Add consent-aware portfolio analytics
        run: node scripts/inject-portfolio-analytics.mjs build/product-site
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/product-site
      - name: Deploy Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
