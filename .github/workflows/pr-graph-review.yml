name: Transformation graph PR review

on:
  pull_request:

permissions:
  contents: read

jobs:
  graph-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build transformation review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "${BASE_SHA}:examples/sap-s4-customer-migration.yaml" > /tmp/before.yaml
          transformation-graph review \
            /tmp/before.yaml \
            examples/sap-s4-customer-migration.yaml \
            --impact-depth 2 \
            --policy policies/enterprise-baseline.yaml \
            --output /tmp/transformation-review.md
          cat /tmp/transformation-review.md >> "$GITHUB_STEP_SUMMARY"
