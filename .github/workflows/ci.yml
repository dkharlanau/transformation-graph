name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate canonical example
        run: transformation-graph validate examples/sap-s4-customer-migration.yaml
      - name: Quality gate canonical example
        run: transformation-graph quality examples/sap-s4-customer-migration.yaml --strict
      - name: Governance scorecard and focused views
        run: |
          transformation-graph scorecard examples/sap-s4-customer-migration.yaml --format markdown --output /tmp/scorecard.md --fail-below 50
          transformation-graph governance-view examples/sap-s4-customer-migration.yaml ownership --format json --output /tmp/ownership.json
          transformation-graph governance-view examples/sap-s4-customer-migration.yaml test-coverage --format json --output /tmp/test-coverage.json
          transformation-graph governance-view examples/sap-s4-customer-migration.yaml change-readiness --format html --output /tmp/change-readiness.html
      - name: Policy gate canonical example
        run: transformation-graph policy examples/sap-s4-customer-migration.yaml --pack policies/enterprise-baseline.yaml --fail-on error
      - name: Smoke test GraphML and adapter contract
        run: |
          transformation-graph graphml examples/sap-s4-customer-migration.yaml --output /tmp/graph.graphml
          transformation-graph adapter-contract --format json > /tmp/adapter-contract.json
          test -s /tmp/graph.graphml
          grep -q 'transformation-graph-adapter' /tmp/adapter-contract.json
      - name: Self-test reusable adapter action
        uses: dkharlanau/transformation-graph@main
        with:
          kind: mapping
          input: conformance/adapter-v0.1/mapping.pass.yaml
          fail-on: error
          report-path: /tmp/action-conformance.json
      - name: Verify reusable action output
        run: grep -q '"passed": true' /tmp/action-conformance.json
      - name: Smoke test declarative project build
        run: |
          status=0
          transformation-graph build-project examples/project/transformation-project.yaml --output-dir /tmp/project-build --site || status=$?
          if [ "$status" -ne 0 ]; then
            echo "### Governed project build diagnostics"
            cat /tmp/project-build/build-report.json || true
            exit "$status"
          fi
          transformation-graph validate /tmp/project-build/graph.yaml
          test -s /tmp/project-build/site/index.html
          test -s /tmp/project-build/site/graph.graphml
          test -s /tmp/project-build/site/governance.html
          test -s /tmp/project-build/site/views/ownership.json
      - name: Smoke test traceability and role views
        run: |
          transformation-graph trace examples/sap-s4-customer-migration.yaml --from-type mapping --to-type field --max-depth 2 --format markdown --output /tmp/traceability.md
          transformation-graph role-view examples/sap-s4-customer-migration.yaml integration --format json --output /tmp/integration-role.json
      - name: Smoke test adapter conformance
        run: |
          transformation-graph adapter-check mapping examples/adapters/mapping.yaml --fail-on error
          transformation-graph adapter-check interface examples/adapters/interface.yaml --fail-on error
          transformation-graph adapter-check process examples/adapters/process.yaml --fail-on error
      - name: Smoke test graph diff and review
        run: |
          transformation-graph diff examples/change/before.yaml examples/change/after.yaml --impact-depth 1
          transformation-graph review examples/change/before.yaml examples/change/after.yaml --impact-depth 1 --policy policies/change-readiness.yaml --output /tmp/review.md
      - name: Smoke test agent and MCP contracts
        run: |
          transformation-graph context-pack examples/sap-s4-customer-migration.yaml mapping.customer-to-bp --depth 1 --output /tmp/context-pack.json
          python -c "import asyncio; from transformation_graph.mcp_server import create_mcp_server; s=create_mcp_server('examples/sap-s4-customer-migration.yaml'); assert len(asyncio.run(s.list_tools())) == 8"
      - name: Run tests
        run: pytest -q
      - name: Build wheel and source distribution
        run: |
          python -m build --outdir /tmp/dist
          test "$(find /tmp/dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find /tmp/dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
