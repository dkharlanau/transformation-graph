name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate canonical example
        run: transformation-graph validate examples/sap-s4-customer-migration.yaml
      - name: Quality gate canonical example
        run: transformation-graph quality examples/sap-s4-customer-migration.yaml --strict
      - name: Policy gate canonical example
        run: transformation-graph policy examples/sap-s4-customer-migration.yaml --pack policies/enterprise-baseline.yaml --fail-on error
      - name: Smoke test traceability and role views
        run: |
          transformation-graph trace examples/sap-s4-customer-migration.yaml --from-type mapping --to-type field --max-depth 2 --format markdown --output /tmp/traceability.md
          transformation-graph role-view examples/sap-s4-customer-migration.yaml integration --format json --output /tmp/integration-role.json
          test -s /tmp/traceability.md
          test -s /tmp/integration-role.json
      - name: Smoke test CSV import
        run: transformation-graph import-csv --nodes examples/csv/nodes.csv --edges examples/csv/edges.csv --project-id csv-ci --project-name "CSV CI" --output /tmp/csv-ci.yaml
      - name: Validate imported graph
        run: transformation-graph validate /tmp/csv-ci.yaml
      - name: Smoke test adapter conformance
        run: |
          transformation-graph adapter-check mapping examples/adapters/mapping.yaml --fail-on error
          transformation-graph adapter-check interface examples/adapters/interface.yaml --fail-on error
          transformation-graph adapter-check process examples/adapters/process.yaml --fail-on error
      - name: Smoke test reconciled adapter composition
        run: |
          transformation-graph compose-adapters --mapping examples/adapters/mapping.yaml --interface examples/adapters/interface.yaml --process examples/adapters/process.yaml --project-id adapter-program --project-name "Adapter Program" --output /tmp/adapter-program.yaml
          transformation-graph validate /tmp/adapter-program.yaml
      - name: Smoke test as-code adapters
        run: |
          transformation-graph import-adapter mapping examples/adapters/mapping.yaml --output /tmp/mapping.yaml
          transformation-graph import-adapter interface examples/adapters/interface.yaml --output /tmp/interface.yaml
          transformation-graph import-adapter process examples/adapters/process.yaml --output /tmp/process.yaml
          transformation-graph validate /tmp/mapping.yaml
          transformation-graph validate /tmp/interface.yaml
          transformation-graph validate /tmp/process.yaml
      - name: Smoke test graph diff
        run: transformation-graph diff examples/change/before.yaml examples/change/after.yaml --impact-depth 1
      - name: Smoke test PR review report
        run: transformation-graph review examples/change/before.yaml examples/change/after.yaml --impact-depth 1 --policy policies/change-readiness.yaml --output /tmp/review.md && test -s /tmp/review.md
      - name: Smoke test HTML explorer
        run: transformation-graph html examples/sap-s4-customer-migration.yaml --output /tmp/transformation-graph.html && test -s /tmp/transformation-graph.html
      - name: Smoke test static site bundle
        run: |
          transformation-graph site examples/sap-s4-customer-migration.yaml --output /tmp/site --base-url https://example.test/transformation-graph/
          test -s /tmp/site/index.html
          test -s /tmp/site/graph.json
          test -s /tmp/site/llms.txt
          test -s /tmp/site/roles/architect.json
      - name: Smoke test agent context pack
        run: transformation-graph context-pack examples/sap-s4-customer-migration.yaml mapping.customer-to-bp --depth 1 --output /tmp/context-pack.json && test -s /tmp/context-pack.json
      - name: Smoke test MCP registration
        run: python -c "import asyncio; from transformation_graph.mcp_server import create_mcp_server; s=create_mcp_server('examples/sap-s4-customer-migration.yaml'); assert len(asyncio.run(s.list_tools())) == 6; assert len(asyncio.run(s.list_resources())) == 1; assert len(asyncio.run(s.list_resource_templates())) == 1"
      - name: Run tests
        run: pytest -q
