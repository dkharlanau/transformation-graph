name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate canonical example
        run: transformation-graph validate examples/sap-s4-customer-migration.yaml
      - name: Quality gate canonical example
        run: transformation-graph quality examples/sap-s4-customer-migration.yaml --strict
      - name: Smoke test CSV import
        run: transformation-graph import-csv --nodes examples/csv/nodes.csv --edges examples/csv/edges.csv --project-id csv-ci --project-name "CSV CI" --output /tmp/csv-ci.yaml
      - name: Validate imported graph
        run: transformation-graph validate /tmp/csv-ci.yaml
      - name: Smoke test graph diff
        run: transformation-graph diff examples/change/before.yaml examples/change/after.yaml --impact-depth 1
      - name: Run tests
        run: pytest -q
